name: Deploy website

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: EAS Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build website
        run: pnpm build:web
        env:
          # .env is git-ignored, so the build gets the dev deployment from here.
          EXPO_PUBLIC_CONVEX_URL: https://youthful-finch-562.eu-west-1.convex.cloud

      - name: Deploy
        run: eas deploy --prod
